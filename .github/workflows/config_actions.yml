name: Build and Test Code

on:
  push:
  pull_request:

jobs:
  job1:
    runs-on: ubuntu-latest
    environment: DOCKER_USERNAME

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      API_KEY: ${{ secrets.API_KEY }}
      ANTHROPIC_API_KEY: 34978398

      DATABASE_HOSTNAME: localhost
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: testdb
      DATABASE_USERNAME: postgres

      REDIS_URL: redis://localhost:6379/0

      SECRET_KEY: your-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 7200

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Pulling git repo
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API key
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API_KEY is present"
          else
            echo "API_KEY is EMPTY"
            exit 1
          fi

      - name: Enable pgvector
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d testdb \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-integration-rag-multi:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ai-integration-rag-multi:latest